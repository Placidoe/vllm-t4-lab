<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
  <title id="title">PagedAttention 的逻辑 token 到物理 KV block 映射</title><desc id="desc">同一请求的逻辑 token 页面借助 block table 映射到非连续的物理 KV blocks，从而避免连续预分配的内部碎片。</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0 L0 6 L9 3z" fill="#a78bfa"/></marker></defs>
  <rect width="1200" height="440" rx="24" fill="#111827"/>
  <text x="56" y="62" fill="#f8fafc" font-size="28" font-family="system-ui" font-weight="700">PagedAttention：逻辑连续，不要求物理连续</text>
  <text x="56" y="92" fill="#c4b5fd" font-size="16" font-family="system-ui">请求只按需申请下一个 KV block；释放时归还共享池</text>
  <text x="70" y="150" fill="#e2e8f0" font-size="18" font-family="system-ui" font-weight="700">Request A 的逻辑 token pages</text>
  <g font-family="system-ui" text-anchor="middle" font-size="18" font-weight="700"><rect x="78" y="178" width="166" height="72" rx="12" fill="#312e81" stroke="#a5b4fc"/><text x="161" y="222" fill="#eef2ff">0–15</text><rect x="288" y="178" width="166" height="72" rx="12" fill="#312e81" stroke="#a5b4fc"/><text x="371" y="222" fill="#eef2ff">16–31</text><rect x="498" y="178" width="166" height="72" rx="12" fill="#312e81" stroke="#a5b4fc"/><text x="581" y="222" fill="#eef2ff">32–47</text></g>
  <text x="70" y="323" fill="#e2e8f0" font-size="18" font-family="system-ui" font-weight="700">共享物理 KV block pool</text>
  <g font-family="system-ui" text-anchor="middle" font-size="18" font-weight="700"><rect x="756" y="178" width="150" height="72" rx="12" fill="#064e3b" stroke="#6ee7b7"/><text x="831" y="222" fill="#d1fae5">block 7</text><rect x="756" y="278" width="150" height="72" rx="12" fill="#064e3b" stroke="#6ee7b7"/><text x="831" y="322" fill="#d1fae5">block 2</text><rect x="996" y="228" width="150" height="72" rx="12" fill="#064e3b" stroke="#6ee7b7"/><text x="1071" y="272" fill="#d1fae5">block 9</text></g>
  <g stroke="#a78bfa" stroke-width="4" fill="none" marker-end="url(#a)"><path d="M244 214 H746"/><path d="M454 214 H640 V314 H746"/><path d="M664 214 H986 V264"/></g>
  <text x="600" y="402" fill="#94a3b8" font-size="16" font-family="system-ui" text-anchor="middle">block table 完成逻辑位置 → 物理地址翻译；消除“按最大长度连续预留”造成的大量内部碎片</text>
</svg>
