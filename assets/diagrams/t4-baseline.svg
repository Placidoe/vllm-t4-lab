<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="450" viewBox="0 0 1200 450" role="img" aria-labelledby="title desc">
  <title id="title">单卡 T4 vLLM 基线的显存与性能观测</title><desc id="desc">Qwen2.5-1.5B 在单张 T4 上的实验：模型约2.89GiB，KV Cache 6.69GiB，其余运行时约5.02GiB；短生成观测16.43 output token/s。</desc>
  <rect width="1200" height="450" rx="24" fill="#0f172a"/>
  <text x="56" y="62" fill="#f8fafc" font-size="28" font-family="system-ui" font-weight="700">Kaggle T4 单卡基线：先看容量，再看并发</text>
  <text x="56" y="92" fill="#cbd5e1" font-size="16" font-family="system-ui">Qwen2.5-1.5B-Instruct · vLLM 0.18.0 · TRITON_ATTN · max_model_len=2048</text>
  <text x="103" y="158" fill="#e2e8f0" font-size="18" font-family="system-ui" font-weight="700">近似显存构成（GiB）</text>
  <rect x="104" y="186" width="820" height="72" rx="15" fill="#1e293b"/><rect x="104" y="186" width="162" height="72" rx="15" fill="#38bdf8"/><rect x="266" y="186" width="375" height="72" fill="#34d399"/><rect x="641" y="186" width="283" height="72" rx="15" fill="#64748b"/>
  <g font-family="system-ui" font-size="17" font-weight="700"><text x="125" y="230" fill="#082f49">权重 2.89</text><text x="390" y="230" fill="#064e3b">KV Cache 6.69</text><text x="697" y="230" fill="#f8fafc">运行时 5.02</text></g>
  <g font-family="system-ui"><rect x="104" y="318" width="248" height="82" rx="16" fill="#172554"/><text x="128" y="350" fill="#bfdbfe" font-size="16">物理 KV 容量</text><text x="128" y="381" fill="#f8fafc" font-size="25" font-weight="700">250,624 tokens</text><rect x="430" y="318" width="248" height="82" rx="16" fill="#064e3b"/><text x="454" y="350" fill="#a7f3d0" font-size="16">短生成观测</text><text x="454" y="381" fill="#f8fafc" font-size="25" font-weight="700">16.43 tok/s</text><rect x="756" y="318" width="336" height="82" rx="16" fill="#3f2b05"/><text x="780" y="350" fill="#fde68a" font-size="16">正确解读</text><text x="780" y="381" fill="#f8fafc" font-size="20" font-weight="700">不是峰值吞吐</text></g>
</svg>
