<svg xmlns="http://www.w3.org/2000/svg" width="920" height="470" viewBox="0 0 920 470" role="img" aria-labelledby="title desc">
  <title id="title">Kaggle T4 x2 offline batch throughput: TP1 vs TP2</title>
  <desc id="desc">Output tokens per second across batch sizes 1, 4, 8 and 16. TP2 is faster at every measured point.</desc>
  <rect width="920" height="470" fill="#0d1117"/><g fill="none" stroke="#30363d" stroke-width="1"><path d="M90 75H875M90 160H875M90 245H875M90 330H875"/><path d="M90 75V330M340 75V330M590 75V330M840 75V330"/></g>
  <g fill="#c9d1d9" font-family="ui-monospace,monospace" font-size="14"><text x="90" y="35" font-size="20">Kaggle T4 × 2 · offline decoder throughput</text><text x="20" y="335">0</text><text x="8" y="250">450</text><text x="8" y="165">900</text><text x="0" y="80">1350</text><text x="84" y="365">1</text><text x="334" y="365">4</text><text x="584" y="365">8</text><text x="830" y="365">16</text><text x="366" y="415">batch size (requests)</text><text x="90" y="445" fill="#8b949e">two repeats / fixed self-authored prompt / not a serving latency result</text></g>
  <polyline points="90,317 340,281 590,236 840,151" fill="none" stroke="#58a6ff" stroke-width="4"/><polyline points="90,308 340,251 590,178 840,88" fill="none" stroke="#f2cc60" stroke-width="4"/>
  <g fill="#58a6ff"><circle cx="90" cy="317" r="6"/><circle cx="340" cy="281" r="6"/><circle cx="590" cy="236" r="6"/><circle cx="840" cy="151" r="6"/></g><g fill="#f2cc60"><circle cx="90" cy="308" r="6"/><circle cx="340" cy="251" r="6"/><circle cx="590" cy="178" r="6"/><circle cx="840" cy="88" r="6"/></g>
  <g font-family="ui-monospace,monospace" font-size="15"><line x1="620" y1="42" x2="650" y2="42" stroke="#58a6ff" stroke-width="4"/><text x="660" y="47" fill="#c9d1d9">TP=1</text><line x1="740" y1="42" x2="770" y2="42" stroke="#f2cc60" stroke-width="4"/><text x="780" y="47" fill="#c9d1d9">TP=2</text></g>
</svg>
